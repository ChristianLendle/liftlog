<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- full-bleed background: OS applies its own mask shape (maskable) -->
  <rect width="192" height="192" fill="#F0F2F7"/>
  <!-- logo content recentred and scaled into the maskable safe zone (~80%) so nothing is clipped -->
  <g transform="translate(96 96) scale(0.86) translate(-89.5 -96)">
    <text x="20" y="104"
      font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
      font-weight="700" font-size="26" fill="#1C2B4A" letter-spacing="1.6">PRSON</text>
    <circle cx="145" cy="96" r="14" fill="none" stroke="#2E4A7A" stroke-width="2"/>
    <circle cx="145" cy="96" r="8" fill="none" stroke="#2E4A7A" stroke-width="1" opacity="0.3"/>
    <text x="145" y="100"
      font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
      font-weight="700" font-size="9" fill="#2E4A7A"
      text-anchor="middle" letter-spacing="0.8">AL</text>
  </g>
</svg>
